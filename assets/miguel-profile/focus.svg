<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="344" viewBox="0 0 1280 344" role="img" aria-label="Análise de sistemas, experiência do usuário e desenvolvimento Full Stack"><title>Análise de sistemas, experiência do usuário e desenvolvimento Full Stack</title><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset=".6" stop-color="#080E19"/><stop offset="1" stop-color="#10213C"/></linearGradient>
    <linearGradient id="blue"><stop stop-color="#4E88FF"/><stop offset=".52" stop-color="#22C4ED"/><stop offset="1" stop-color="#8BF5E5"/></linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12325A"/><stop offset="1" stop-color="#0B1729"/></linearGradient>
