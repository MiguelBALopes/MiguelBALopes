    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#76B3E0" opacity=".16"/></pattern>
    </defs><style>text{font-family:'Segoe UI',Arial,sans-serif}.white{fill:#F2F6FD}.muted{fill:#A6B5CC}.cyan{fill:#74E1F1}.small{font-size:14px;letter-spacing:2.3px;font-weight:600}</style><g transform="translate(0 0)"><rect x="1" y="1" width="414" height="325" rx="16" fill="#0B1423" stroke="#263B54"/><path d="M27 1h65" stroke="#6EDFEF" stroke-width="2"/><g transform="translate(28 30)" stroke="#71E0F1" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="25" height="29" rx="3"/><path d="M8 10h13M8 16h9M8 22h5m10 5 6 6"/><circle cx="24" cy="23" r="6"/></g><text x="27" y="109" class="cyan small" font-size="13">01 / ANÁLISE</text><text x="27" y="155" class="white" font-size="24" font-weight="600" letter-spacing="-.5">Entender antes de construir.</text><text x="27" y="205" class="muted" font-size="18">Necessidades e regras de negócio.</text><text x="27" y="238" class="muted" font-size="18">Processos, prioridades e contexto.</text><text x="27" y="271" class="muted" font-size="18">Visão do problema por inteiro.</text></g><g transform="translate(432 0)"><rect x="1" y="1" width="414" height="325" rx="16" fill="#0B1423" stroke="#263B54"/><path d="M27 1h65" stroke="#6EDFEF" stroke-width="2"/><g transform="translate(28 30)" stroke="#71E0F1" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="30" height="23" rx="3"/><path d="M1 10h30M11 31h10M16 26v5M7 16h5M7 21h10m7-7-4 7 8-2Z"/></g><text x="27" y="109" class="cyan small" font-size="13">02 / EXPERIÊNCIA</text><text x="27" y="155" class="white" font-size="24" font-weight="600" letter-spacing="-.5">Facilitar cada interação.</text><text x="27" y="205" class="muted" font-size="18">Interfaces claras e consistentes.</text><text x="27" y="238" class="muted" font-size="18">Fluxos alinhados à rotina de uso.</text><text x="27" y="271" class="muted" font-size="18">Atenção a quem utiliza o produto.</text></g><g transform="translate(864 0)"><rect x="1" y="1" width="414" height="325" rx="16" fill="#0B1423" stroke="#263B54"/><path d="M27 1h65" stroke="#6EDFEF" stroke-width="2"/><g transform="translate(28 30)" stroke="#71E0F1" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 7-8 9 8 9m12-18 8 9-8 9M19 3l-6 26"/></g><text x="27" y="109" class="cyan small" font-size="13">03 / DESENVOLVIMENTO</text><text x="27" y="155" class="white" font-size="24" font-weight="600" letter-spacing="-.5">Conectar todas as camadas.</text><text x="27" y="205" class="muted" font-size="18">Interface, lógica e persistência.</text><text x="27" y="238" class="muted" font-size="18">Integrações e serviços em nuvem.</text><text x="27" y="271" class="muted" font-size="18">Evolução dos produtos da UXi.</text></g></svg>